; Key Rebind - Project Lazarus (experimental)
;
; After you start the game once with this mod enabled, this folder contains
; actions-*.json files listing every action the game has and its current
; bindings ("path"). Use those names and paths below.
;
; Format:   action name = <current path> -> <new path>
; Examples:
;   Interact = <Keyboard>/e -> <Keyboard>/f
;   Jump     = <Keyboard>/space -> <Keyboard>/c
;
; Paths: <Keyboard>/a ... <Keyboard>/z, <Keyboard>/space, <Keyboard>/leftShift,
;        <Mouse>/leftButton, <Mouse>/rightButton, <Gamepad>/buttonSouth, ...
; Changes apply on the next start, or right away with the console command: rebind.apply

