; Dev Console - Project Lazarus
; Changes take effect the next time the game starts.

[console]
; key that opens/closes the console: F1-F12, grave (the ` key), insert
key = F6
; console height as % of the game window
height_percent = 45
; 60 (see-through) .. 255 (solid)
opacity = 235
; free the mouse cursor while the console is open. true/false
unlock_cursor = true

[autoexec]
; commands to run automatically once per session, separated by ;
; example - boot straight into the prison finale:
;   commands = load TooFarGone; god
commands =
; ...after this scene has loaded
after_scene = Main Menu
; ...and this many frames later (gives the menu time to finish setting up)
delay_frames = 120
