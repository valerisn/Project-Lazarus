; Mouse Sensitivity - Project Lazarus (experimental)
; Multiplies camera look speed on top of the in-game sensitivity slider.
; 1.0 = unchanged, 0.5 = half as fast, 2.0 = twice as fast. Range 0.05 - 10.

[look]
mouse_scale = 1.0
gamepad_scale = 1.0
; extra multiplier for up/down only (e.g. 0.8 = vertical slower than horizontal)
vertical_ratio = 1.0
