name: build

on:
  push:
  pull_request:

# read-only token: this workflow builds and tests, it never writes to the repo
permissions:
  contents: read

jobs:
  windows:
    # pinned so a runner image bump can't silently change the toolchain
    runs-on: windows-2022
    steps:
      # actions pinned to full commit SHAs, not tags - a moved tag can't
      # swap code under us. dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (unit, installer, tools, end-to-end bootstrap)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Checksums
        shell: pwsh
        run: scripts/checksums.ps1 build/dist

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-lazarus-dist
          path: build/dist/
