name: build

on:
  push:
  pull_request:

# never writes to the repo
permissions:
  contents: read

jobs:
  windows:
    # pinned, a new image shouldn't quietly change the compiler
    runs-on: windows-2022
    steps:
      # SHAs not tags, tags can be moved. dependabot bumps them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (unit, installer, tools, end-to-end bootstrap)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Checksums
        shell: pwsh
        run: scripts/checksums.ps1 build/dist

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-lazarus-dist
          path: build/dist/
